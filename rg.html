<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Registrar RG - Polícia RP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Registrar RG - Laguna RP</h1>
<nav>
<a href="index.html">Início</a>
<a href="rg.html">RG</a>
<a href="placa.html">Placa</a>
<a href="bo.html">Boletim</a>
<a href="mandado.html">Mandados</a>
<a href="multa.html">Multas</a>
</nav>
</header>

<section>
<form id="rgForm">
  Nome completo:<br>
  <input type="text" name="nome" required><br>
  CPF:<br>
  <input type="text" name="cpf" required><br>
  RG:<br>
  <input type="text" name="rg" required><br>
  <button type="submit">Registrar</button>
</form>

<h3>Registros</h3>
<table id="rgList">
<tr><th>Nome</th><th>CPF</th><th>RG</th></tr>
</table>
</section>

<script>
const form = document.getElementById('rgForm');
const table = document.getElementById('rgList');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  await fetch('/rg', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  form.reset();
  loadRGs();
});

async function loadRGs() {
  const res = await fetch('/rg');
  const rgs = await res.json();
  table.innerHTML = '<tr><th>Nome</th><th>CPF</th><th>RG</th></tr>' + 
    rgs.map(r => `<tr><td>${r.nome}</td><td>${r.cpf}</td><td>${r.rg}</td></tr>`).join('');
}

loadRGs();
</script>

<footer>
<p>© 2026 - Polícia Laguna RP</p>
</footer>
</body>
</html>
